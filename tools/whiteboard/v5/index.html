<!DOCTYPE html>
<html lang="en" class="h-full w-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SPRK-Web | Whiteboard Pro Unified</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .h-dvh { height: 100dvh; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        
        canvas { touch-action: none; }
        
        .active-tool {
            background-color: #6366f1 !important;
            color: #ffffff !important;
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
        }

        .tool-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tool-btn:hover:not(.active-tool) {
            background-color: #334155;
            color: #f8fafc;
        }

        .sticky-note-input {
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            font-family: inherit;
            width: 100%;
            height: 100%;
            color: #0f172a;
        }

        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }
        .pt-safe { padding-top: env(safe-area-inset-top, 0.5rem); }
    </style>
    <link rel="stylesheet" href="/site-theme.css">
    <script type="module" src="/js/site-theme.js"></script>
</head>
<body class="bg-slate-950 h-dvh w-full overflow-hidden flex flex-col font-sans text-slate-200 select-none">

    <header class="h-14 border-b border-slate-800 bg-slate-900/90 backdrop-blur-md px-3 sm:px-4 flex items-center justify-between shrink-0 z-30 shadow-lg pt-safe">
        <div class="flex items-center gap-2 sm:gap-3">
            <div data-appbar-brand class="flex items-center text-base sm:text-lg font-black uppercase tracking-wider">
                <span class="bg-gradient-to-r from-cyan-400 via-indigo-400 to-purple-500 bg-clip-text text-transparent">Sprk</span>
                <span class="text-white font-light ml-1">-Board</span>
            </div>
            <span class="text-[10px] px-2 py-0.5 bg-indigo-500/20 text-indigo-300 rounded-full border border-indigo-500/30 hidden sm:inline-block font-semibold">Pro v5.0</span>
        </div>

        <div class="flex items-center gap-1 sm:gap-2">
            <button id="undo-btn" class="p-2 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition disabled:opacity-30 disabled:hover:bg-transparent" title="Undo (Ctrl+Z)">
                <i data-lucide="undo-2" class="w-4 h-4"></i>
            </button>
            <button id="redo-btn" class="p-2 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition disabled:opacity-30 disabled:hover:bg-transparent" title="Redo (Ctrl+Y)">
                <i data-lucide="redo-2" class="w-4 h-4"></i>
            </button>
            <div class="h-4 w-[1px] bg-slate-800 mx-0.5 sm:mx-1"></div>
            <button id="duplicate-btn" class="p-2 rounded-lg text-indigo-400 hover:bg-indigo-950/40 transition disabled:opacity-30" title="Duplicate Selected (Ctrl+D)">
                <i data-lucide="copy" class="w-4 h-4"></i>
            </button>
            <button id="delete-selected-btn" class="p-2 rounded-lg text-amber-400 hover:bg-amber-950/40 transition disabled:opacity-30" title="Delete Selected (Del)">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
            <button id="clear-btn" class="p-2 rounded-lg text-rose-400 hover:bg-rose-950/40 transition" title="Clear Canvas">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
            </button>
            <div class="h-4 w-[1px] bg-slate-800 mx-0.5 sm:mx-1"></div>
            <button id="image-upload-btn" class="p-2 rounded-lg text-emerald-400 hover:bg-emerald-950/40 transition" title="Upload Image">
                <i data-lucide="image" class="w-4 h-4"></i>
            </button>
            <input type="file" id="image-input" accept="image/*" class="hidden">
            <button id="export-btn" class="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-2.5 sm:px-3 py-1.5 rounded-lg font-medium transition active:scale-95 shadow-md shadow-indigo-600/20">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Export PNG</span>
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative w-full h-full">

        <aside id="desktop-sidebar" class="hidden md:flex lg:flex absolute left-4 top-4 bottom-4 z-30 w-14 bg-slate-900/90 backdrop-blur-md border border-slate-800 rounded-2xl p-2 flex-col items-center justify-between shadow-2xl">
            <div class="flex flex-col gap-1.5 w-full">
                <button id="tool-select" class="tool-btn p-2.5 rounded-xl text-slate-400 flex justify-center items-center" title="Select & Move (V)">
                    <i data-lucide="mouse-pointer" class="w-5 h-5"></i>
                </button>
                <button id="tool-pan" class="tool-btn p-2.5 rounded-xl text-slate-400 flex justify-center items-center" title="Pan Canvas (Space+Drag)">
                    <i data-lucide="hand" class="w-5 h-5"></i>
                </button>
                <button id="tool-laser" class="tool-btn p-2.5 rounded-xl text-slate-400 flex justify-center items-center" title="Laser Pointer (L)">
                    <i data-lucide="pointer" class="w-5 h-5"></i>
                </button>
                
                <div class="h-[1px] bg-slate-800 my-1"></div>

                <button id="tool-pen" class="tool-btn active-tool p-2.5 rounded-xl text-slate-400 flex justify-center items-center" title="Pen (P)">
                    <i data-lucide="pencil" class="w-5 h-5"></i>
                </button>
                <button id="tool-eraser" class="tool-btn p-2.5 rounded-xl text-slate-400 flex justify-center items-center" title="Object Eraser (E)">
                    <i data-lucide="eraser" class="w-5 h-5"></i>
                </button>
                <button id="tool-highlighter" class="tool-btn p-2.5 rounded-xl text-slate-400 flex justify-center items-center" title="Highlighter (H)">
                    <i data-lucide="highlighter" class="w-5 h-5"></i>
                </button>

                <div class="h-[1px] bg-slate-800 my-1"></div>

                <button id="tool-text" class="tool-btn p-2.5 rounded-xl text-slate-400 flex justify-center items-center" title="Text (T)">
                    <i data-lucide="type" class="w-5 h-5"></i>
                </button>
                <button id="tool-sticky" class="tool-btn p-2.5 rounded-xl text-slate-400 flex justify-center items-center" title="Sticky Note (S)">
                    <i data-lucide="sticky-note" class="w-5 h-5"></i>
                </button>

                <div class="h-[1px] bg-slate-800 my-1"></div>

                <button id="tool-line" class="tool-btn p-2.5 rounded-xl text-slate-400 flex justify-center items-center" title="Line">
                    <i data-lucide="minus" class="w-5 h-5"></i>
                </button>
                <button id="tool-arrow" class="tool-btn p-2.5 rounded-xl text-slate-400 flex justify-center items-center" title="Arrow">
                    <i data-lucide="arrow-up-right" class="w-5 h-5"></i>
                </button>
                <button id="tool-rect" class="tool-btn p-2.5 rounded-xl text-slate-400 flex justify-center items-center" title="Rectangle">
                    <i data-lucide="square" class="w-5 h-5"></i>
                </button>
                <button id="tool-circle" class="tool-btn p-2.5 rounded-xl text-slate-400 flex justify-center items-center" title="Circle">
                    <i data-lucide="circle" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="flex flex-col gap-1.5 w-full">
                <button id="theme-btn" class="tool-btn p-2.5 rounded-xl text-slate-400 flex justify-center items-center" title="Toggle Theme">
                    <i data-lucide="sun" class="w-5 h-5"></i>
                </button>
            </div>
        </aside>

        <main class="flex-1 h-full w-full relative bg-slate-950 overflow-hidden" id="canvas-container">
            <canvas id="whiteboard" class="absolute inset-0 cursor-crosshair z-10"></canvas>
            <div id="html-overlay" class="absolute inset-0 pointer-events-none z-20 overflow-hidden"></div>
        </main>

        <div class="lg:hidden fixed bottom-4 inset-x-4 z-40 flex flex-col gap-2 pointer-events-none pb-safe">
            
            <div id="mobile-props-card" class="hidden pointer-events-auto bg-slate-900/95 backdrop-blur-md border border-slate-800 rounded-2xl p-3 shadow-2xl transition-all duration-200">
                <div class="flex flex-col gap-2 text-xs">
                    <div class="flex items-center justify-between gap-3">
                        <div class="flex items-center gap-2 overflow-x-auto custom-scrollbar py-1">
                            <input type="color" id="m-wb-color" value="#ffffff" class="w-7 h-7 rounded-lg cursor-pointer bg-transparent border-0 p-0 shrink-0">
                            <div id="m-color-history-container" class="flex gap-1.5 shrink-0"></div>
                        </div>
                        <div class="h-4 w-[1px] bg-slate-800 shrink-0"></div>
                        <div class="flex items-center gap-2 shrink-0">
                            <input type="range" id="m-wb-size" min="1" max="40" value="3" class="w-16 accent-indigo-500 h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                            <span id="m-size-preview" class="text-[11px] text-slate-400 min-w-[20px]">3p</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 pt-1 border-t border-slate-800/60">
                        <i data-lucide="eye" class="w-3.5 h-3.5 text-slate-400 shrink-0"></i>
                        <input type="range" id="m-wb-opacity" min="0.1" max="1" step="0.05" value="1" class="w-full accent-indigo-500 h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                        <span id="m-opacity-preview" class="text-[11px] text-slate-400 min-w-[30px]">100%</span>
                    </div>
                </div>
            </div>

            <div class="pointer-events-auto bg-slate-900/90 backdrop-blur-md border border-slate-800 rounded-2xl p-2 shadow-2xl flex items-center justify-between gap-1">
                <div class="flex items-center gap-1 overflow-x-auto custom-scrollbar py-0.5">
                    <button class="m-tool-btn p-2.5 rounded-xl bg-indigo-600 text-white shrink-0 active:scale-95 transition" data-tool="pen" title="Pen"><i data-lucide="pencil" class="w-5 h-5"></i></button>
                    <button class="m-tool-btn p-2.5 rounded-xl bg-slate-800 text-slate-300 shrink-0 active:scale-95 transition" data-tool="eraser" title="Eraser"><i data-lucide="eraser" class="w-5 h-5"></i></button>
                    <button class="m-tool-btn p-2.5 rounded-xl bg-slate-800 text-slate-300 shrink-0 active:scale-95 transition" data-tool="select" title="Select"><i data-lucide="mouse-pointer" class="w-5 h-5"></i></button>
                    <button class="m-tool-btn p-2.5 rounded-xl bg-slate-800 text-slate-300 shrink-0 active:scale-95 transition" data-tool="pan" title="Pan"><i data-lucide="hand" class="w-5 h-5"></i></button>
                    <button class="m-tool-btn p-2.5 rounded-xl bg-slate-800 text-slate-300 shrink-0 active:scale-95 transition" data-tool="highlighter" title="Highlight"><i data-lucide="highlighter" class="w-5 h-5"></i></button>
                    <button class="m-tool-btn p-2.5 rounded-xl bg-slate-800 text-slate-300 shrink-0 active:scale-95 transition" data-tool="sticky" title="Sticky Note"><i data-lucide="sticky-note" class="w-5 h-5"></i></button>
                </div>

                <div class="flex items-center gap-1 shrink-0 pl-1 border-l border-slate-800">
                    <button id="m-props-toggle" class="p-2.5 rounded-xl bg-slate-800 text-slate-300 active:scale-95 transition" title="Styling Options">
                        <i data-lucide="palette" class="w-5 h-5"></i>
                    </button>
                    <button id="mobile-menu-btn" class="p-2.5 rounded-xl bg-indigo-600 text-white active:scale-95 transition shadow-lg shadow-indigo-600/30" title="Full Toolkit">
                        <i data-lucide="layout-grid" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="mobile-sheet" class="lg:hidden fixed inset-x-0 bottom-0 z-50 bg-slate-900/98 backdrop-blur-xl border-t border-slate-800 rounded-t-3xl p-5 shadow-2xl transition-transform duration-300 translate-y-full pb-safe">
            <div class="w-12 h-1 bg-slate-700 rounded-full mx-auto mb-4"></div>
            
            <div class="flex justify-between items-center mb-3">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Canvas Tools</span>
                <button id="close-mobile-sheet" class="text-slate-400 hover:text-white p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <div class="grid grid-cols-4 gap-2 mb-4">
                <button class="m-sheet-btn p-3 rounded-xl bg-slate-800 text-slate-300 flex flex-col items-center gap-1.5 text-xs transition" data-tool="select"><i data-lucide="mouse-pointer" class="w-5 h-5"></i>Select</button>
                <button class="m-sheet-btn p-3 rounded-xl bg-slate-800 text-slate-300 flex flex-col items-center gap-1.5 text-xs transition" data-tool="pan"><i data-lucide="hand" class="w-5 h-5"></i>Pan</button>
                <button class="m-sheet-btn p-3 rounded-xl bg-indigo-600 text-white flex flex-col items-center gap-1.5 text-xs transition" data-tool="pen"><i data-lucide="pencil" class="w-5 h-5"></i>Pen</button>
                <button class="m-sheet-btn p-3 rounded-xl bg-slate-800 text-slate-300 flex flex-col items-center gap-1.5 text-xs transition" data-tool="eraser"><i data-lucide="eraser" class="w-5 h-5"></i>Eraser</button>
                <button class="m-sheet-btn p-3 rounded-xl bg-slate-800 text-slate-300 flex flex-col items-center gap-1.5 text-xs transition" data-tool="highlighter"><i data-lucide="highlighter" class="w-5 h-5"></i>Highlight</button>
                <button class="m-sheet-btn p-3 rounded-xl bg-slate-800 text-slate-300 flex flex-col items-center gap-1.5 text-xs transition" data-tool="auto-shape"><i data-lucide="sparkles" class="w-5 h-5"></i>Smart</button>
                <button class="m-sheet-btn p-3 rounded-xl bg-slate-800 text-slate-300 flex flex-col items-center gap-1.5 text-xs transition" data-tool="text"><i data-lucide="type" class="w-5 h-5"></i>Text</button>
                <button class="m-sheet-btn p-3 rounded-xl bg-slate-800 text-slate-300 flex flex-col items-center gap-1.5 text-xs transition" data-tool="sticky"><i data-lucide="sticky-note" class="w-5 h-5"></i>Sticky</button>
                <button class="m-sheet-btn p-3 rounded-xl bg-slate-800 text-slate-300 flex flex-col items-center gap-1.5 text-xs transition" data-tool="laser"><i data-lucide="pointer" class="w-5 h-5"></i>Laser</button>
                <button class="m-sheet-btn p-3 rounded-xl bg-slate-800 text-slate-300 flex flex-col items-center gap-1.5 text-xs transition" data-tool="line"><i data-lucide="minus" class="w-5 h-5"></i>Line</button>
                <button class="m-sheet-btn p-3 rounded-xl bg-slate-800 text-slate-300 flex flex-col items-center gap-1.5 text-xs transition" data-tool="arrow"><i data-lucide="arrow-up-right" class="w-5 h-5"></i>Arrow</button>
                <button class="m-sheet-btn p-3 rounded-xl bg-slate-800 text-slate-300 flex flex-col items-center gap-1.5 text-xs transition" data-tool="rect"><i data-lucide="square" class="w-5 h-5"></i>Rect</button>
                <button class="m-sheet-btn p-3 rounded-xl bg-slate-800 text-slate-300 flex flex-col items-center gap-1.5 text-xs transition" data-tool="circle"><i data-lucide="circle" class="w-5 h-5"></i>Circle</button>
            </div>

            <div class="flex justify-between items-center pt-3 border-t border-slate-800">
                <span class="text-xs text-slate-400">Board Theme</span>
                <button id="m-theme-btn" class="p-2.5 rounded-xl bg-slate-800 text-slate-300 flex items-center gap-2 text-xs">
                    <i data-lucide="sun" class="w-4 h-4"></i>
                    <span>Toggle View</span>
                </button>
            </div>
        </div>

        <div class="hidden lg:flex absolute bottom-4 left-1/2 -translate-x-1/2 z-30 bg-slate-900/90 backdrop-blur-md border border-slate-800 rounded-2xl px-4 py-2.5 items-center gap-4 shadow-2xl text-xs max-w-[95vw] overflow-x-auto custom-scrollbar">
            <div class="flex items-center gap-2 shrink-0">
                <input type="color" id="wb-color" value="#ffffff" class="w-7 h-7 rounded-lg cursor-pointer bg-transparent border-0 p-0">
                <div id="color-history-container" class="flex gap-1.5"></div>
            </div>

            <div class="h-4 w-[1px] bg-slate-800 shrink-0"></div>

            <div class="flex items-center gap-2 shrink-0">
                <i data-lucide="circle-dot" class="w-4 h-4 text-slate-400"></i>
                <input type="range" id="wb-size" min="1" max="40" value="3" class="w-20 accent-indigo-500 h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                <span id="size-preview" class="text-[11px] text-slate-400 min-w-[24px]">3px</span>
            </div>

            <div class="h-4 w-[1px] bg-slate-800 shrink-0"></div>

            <div class="flex items-center gap-2 shrink-0">
                <i data-lucide="eye" class="w-4 h-4 text-slate-400"></i>
                <input type="range" id="wb-opacity" min="0.1" max="1" step="0.05" value="1" class="w-16 accent-indigo-500 h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                <span id="opacity-preview" class="text-[11px] text-slate-400 min-w-[32px]">100%</span>
            </div>

            <div class="h-4 w-[1px] bg-slate-800 shrink-0"></div>

            <div class="flex items-center gap-1.5 shrink-0">
                <i data-lucide="grid" class="w-4 h-4 text-slate-400"></i>
                <select id="grid-pattern-select" class="bg-slate-800 text-slate-200 text-xs px-2.5 py-1 rounded-lg border border-slate-700 focus:outline-none cursor-pointer">
                    <option value="none">Blank</option>
                    <option value="grid" selected>Grid</option>
                    <option value="dots">Dots</option>
                    <option value="lined">Lined</option>
                    <option value="iso">Isometric</option>
                    <option value="cross">Crosshair</option>
                </select>
            </div>
            
            <button id="snap-grid-btn" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] rounded-lg border border-slate-700 flex items-center gap-1 transition shrink-0" title="Toggle Snap to Grid">
                <i data-lucide="magnet" class="w-3.5 h-3.5"></i>
                <span id="snap-status">Snap: Off</span>
            </button>

            <div class="h-4 w-[1px] bg-slate-800 shrink-0"></div>

            <div class="flex items-center gap-1 shrink-0">
                <button id="zoom-out-btn" class="p-1 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800" title="Zoom Out"><i data-lucide="zoom-out" class="w-4 h-4"></i></button>
                <span id="zoom-level" class="text-[11px] font-mono text-slate-400 min-w-[36px] text-center">100%</span>
                <button id="zoom-in-btn" class="p-1 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800" title="Zoom In"><i data-lucide="zoom-in" class="w-4 h-4"></i></button>
                <button id="zoom-reset-btn" class="p-1 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 text-[10px] font-bold" title="Reset 1:1 Scale">1:1</button>
                <button id="fit-view-btn" class="p-1.5 rounded-lg text-indigo-400 hover:text-indigo-300 hover:bg-slate-800 text-[10px] font-bold flex items-center gap-0.5" title="Recenter View to Content">
                    <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
                    <span>Fit</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Canvas & Elements Setup
        const container = document.getElementById('canvas-container');
        const canvas = document.getElementById('whiteboard');
        const ctx = canvas.getContext('2d');
        const htmlOverlay = document.getElementById('html-overlay');

        // Inputs & Controls
        const colorPicker = document.getElementById('wb-color');
        const sizePicker = document.getElementById('wb-size');
        const sizePreview = document.getElementById('size-preview');
        const opacityPicker = document.getElementById('wb-opacity');
        const opacityPreview = document.getElementById('opacity-preview');
        
        const mColorPicker = document.getElementById('m-wb-color');
        const mSizePicker = document.getElementById('m-wb-size');
        const mSizePreview = document.getElementById('m-size-preview');
        const mOpacityPicker = document.getElementById('m-wb-opacity');
        const mOpacityPreview = document.getElementById('m-opacity-preview');
        const mPropsToggle = document.getElementById('m-props-toggle');
        const mPropsCard = document.getElementById('mobile-props-card');

        const gridSelect = document.getElementById('grid-pattern-select');
        const snapGridBtn = document.getElementById('snap-grid-btn');
        const snapStatus = document.getElementById('snap-status');
        const undoBtn = document.getElementById('undo-btn');
        const redoBtn = document.getElementById('redo-btn');
        const deleteSelectedBtn = document.getElementById('delete-selected-btn');
        const duplicateBtn = document.getElementById('duplicate-btn');
        const themeBtn = document.getElementById('theme-btn');
        const mobileThemeBtn = document.getElementById('m-theme-btn');
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const closeMobileSheetBtn = document.getElementById('close-mobile-sheet');
        const mobileSheet = document.getElementById('mobile-sheet');
        const imageUploadBtn = document.getElementById('image-upload-btn');
        const imageInput = document.getElementById('image-input');

        // Application State
        let activeTool = 'pen';
        let strokeColor = '#ffffff';
        let strokeWidth = 3;
        let strokeOpacity = 1.0;
        let activeGridPattern = 'grid';
        let isSnapToGrid = false;
        let isDarkModeBoard = true;
        let recentColors = ['#ffffff', '#020617', '#ef4444', '#3b82f6', '#10b981', '#f59e0b'];

        // Viewport Coordinates & Camera Transforms
        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isPanning = false;
        let isSpacePressed = false;
        let startPanX = 0, startPanY = 0;

        // Mouse/Touch Interaction State
        let isDrawing = false;
        let currentPath = [];
        let selectedElementIndices = [];
        let isDraggingElement = false;
        let dragOffsets = [];
        
        // Lasso Selection State
        let isLassoing = false;
        let lassoStart = { x: 0, y: 0 };
        let lassoCurrent = { x: 0, y: 0 };

        // Laser Engine
        let laserTrail = [];

        // Data & Undo Stacks
        let elements = [];
        let undoStack = [];
        let redoStack = [];

        // Touch Gesture Tracking
        let initialPinchDistance = null;
        let initialPinchScale = 1;

        const STORAGE_KEY = 'SPRK_WHITEBOARD_DATA_V2';

        function initStorage() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    elements = JSON.parse(saved);
                    // Re-instantiate images from source stored in object data
                    elements.forEach(el => {
                        if (el.type === 'image' && el.src) {
                            const img = new Image();
                            img.src = el.src;
                            el.imgElement = img;
                        }
                    });
                } catch (e) {
                    elements = [];
                }
            }
        }

        function saveStorage() {
            // Strip DOM elements before serializing to localStorage
            const cleanElements = elements.map(el => {
                if (el.type === 'image') {
                    const { imgElement, ...rest } = el;
                    return rest;
                }
                return el;
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(cleanElements));
        }

        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            requestRender();
        }

        function pushState() {
            const snapshot = elements.map(el => {
                if (el.type === 'image') {
                    const { imgElement, ...rest } = el;
                    return rest;
                }
                return el;
            });
            undoStack.push(JSON.stringify(snapshot));
            if (undoStack.length > 50) undoStack.shift();
            redoStack = [];
            updateUIState();
            saveStorage();
        }

        function updateUIState() {
            undoBtn.disabled = undoStack.length === 0;
            redoBtn.disabled = redoStack.length === 0;
            const hasSelection = selectedElementIndices.length > 0;
            deleteSelectedBtn.disabled = !hasSelection;
            duplicateBtn.disabled = !hasSelection;
        }

        // Coordinate Conversions
        function screenToWorld(sx, sy) {
            return {
                x: (sx - panX) / scale,
                y: (sy - panY) / scale
            };
        }

        function worldToScreen(wx, wy) {
            return {
                x: wx * scale + panX,
                y: wy * scale + panY
            };
        }

        function snapValue(val, step = 20) {
            return isSnapToGrid ? Math.round(val / step) * step : val;
        }

        function snapPoint(pt, step = 20) {
            if (!isSnapToGrid) return pt;
            return {
                x: Math.round(pt.x / step) * step,
                y: Math.round(pt.y / step) * step
            };
        }

        function getEventCoords(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            const screenX = clientX - rect.left;
            const screenY = clientY - rect.top;

            return {
                screenX,
                screenY,
                world: screenToWorld(screenX, screenY)
            };
        }

        // Rendering Loop Optimization
        let renderRequested = false;
        function requestRender() {
            if (!renderRequested) {
                renderRequested = true;
                requestAnimationFrame(render);
            }
        }

        function renderGrid(targetCtx, w, h, currentPanX = panX, currentPanY = panY, currentScale = scale) {
            targetCtx.fillStyle = isDarkModeBoard ? '#020617' : '#f8fafc';
            targetCtx.fillRect(0, 0, w, h);

            if (activeGridPattern === 'none') return;

            targetCtx.save();
            targetCtx.strokeStyle = isDarkModeBoard ? 'rgba(255, 255, 255, 0.08)' : 'rgba(0, 0, 0, 0.08)';
            targetCtx.fillStyle = isDarkModeBoard ? 'rgba(255, 255, 255, 0.12)' : 'rgba(0, 0, 0, 0.12)';
            targetCtx.lineWidth = 1;

            const step = 30 * currentScale;
            const offsetX = currentPanX % step;
            const offsetY = currentPanY % step;

            if (activeGridPattern === 'grid') {
                targetCtx.beginPath();
                for (let x = offsetX; x < w; x += step) {
                    targetCtx.moveTo(x, 0); targetCtx.lineTo(x, h);
                }
                for (let y = offsetY; y < h; y += step) {
                    targetCtx.moveTo(0, y); targetCtx.lineTo(w, y);
                }
                targetCtx.stroke();
            } else if (activeGridPattern === 'lined') {
                targetCtx.beginPath();
                for (let y = offsetY; y < h; y += step) {
                    targetCtx.moveTo(0, y); targetCtx.lineTo(w, y);
                }
                targetCtx.stroke();
            } else if (activeGridPattern === 'dots') {
                for (let x = offsetX; x < w; x += step) {
                    for (let y = offsetY; y < h; y += step) {
                        targetCtx.beginPath();
                        targetCtx.arc(x, y, 1.2 * Math.min(currentScale, 1.5), 0, Math.PI * 2);
                        targetCtx.fill();
                    }
                }
            } else if (activeGridPattern === 'iso') {
                const isoStep = 40 * currentScale;
                const isoHeight = isoStep * Math.sin(Math.PI / 3);
                targetCtx.beginPath();
                for (let y = -h; y < h * 2; y += isoHeight) {
                    targetCtx.moveTo(0, y);
                    targetCtx.lineTo(w, y + w * Math.tan(Math.PI / 6));
                    targetCtx.moveTo(0, y);
                    targetCtx.lineTo(w, y - w * Math.tan(Math.PI / 6));
                }
                for (let x = currentPanX % isoStep; x < w; x += isoStep) {
                    targetCtx.moveTo(x, 0); targetCtx.lineTo(x, h);
                }
                targetCtx.stroke();
            } else if (activeGridPattern === 'cross') {
                const crossSize = 4 * Math.min(currentScale, 1.5);
                for (let x = offsetX; x < w; x += step) {
                    for (let y = offsetY; y < h; y += step) {
                        targetCtx.beginPath();
                        targetCtx.moveTo(x - crossSize, y); targetCtx.lineTo(x + crossSize, y);
                        targetCtx.moveTo(x, y - crossSize); targetCtx.lineTo(x, y + crossSize);
                        targetCtx.stroke();
                    }
                }
            }
            targetCtx.restore();
        }

        function render() {
            renderRequested = false;
            renderGrid(ctx, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(panX, panY);
            ctx.scale(scale, scale);

            elements.forEach((el, index) => {
                drawElement(ctx, el, selectedElementIndices.includes(index));
            });

            if (isDrawing && currentPath.length > 0 && activeTool !== 'eraser') {
                const previewEl = createActiveElement();
                if (previewEl) drawElement(ctx, previewEl, false);
            }

            if (isLassoing) {
                ctx.save();
                ctx.strokeStyle = '#818cf8';
                ctx.fillStyle = 'rgba(99, 102, 241, 0.15)';
                ctx.lineWidth = 1 / scale;
                ctx.setLineDash([4 / scale, 4 / scale]);
                const lx = Math.min(lassoStart.x, lassoCurrent.x);
                const ly = Math.min(lassoStart.y, lassoCurrent.y);
                const lw = Math.abs(lassoCurrent.x - lassoStart.x);
                const lh = Math.abs(lassoCurrent.y - lassoStart.y);
                ctx.fillRect(lx, ly, lw, lh);
                ctx.strokeRect(lx, ly, lw, lh);
                ctx.restore();
            }

            if (laserTrail.length > 0) {
                ctx.save();
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                for (let i = 1; i < laserTrail.length; i++) {
                    const pt1 = laserTrail[i - 1];
                    const pt2 = laserTrail[i];
                    ctx.strokeStyle = `rgba(239, 68, 68, ${pt2.alpha})`;
                    ctx.lineWidth = 6 / scale;
                    ctx.beginPath();
                    ctx.moveTo(pt1.x, pt1.y);
                    ctx.lineTo(pt2.x, pt2.y);
                    ctx.stroke();
                }
                ctx.restore();
            }

            ctx.restore();
            renderHTMLOverlay();
        }

        function drawElement(targetCtx, el, isSelected) {
            targetCtx.save();
            targetCtx.strokeStyle = el.color;
            targetCtx.fillStyle = el.color;
            targetCtx.lineWidth = el.size;
            targetCtx.globalAlpha = el.opacity !== undefined ? el.opacity : 1.0;
            targetCtx.lineCap = 'round';
            targetCtx.lineJoin = 'round';

            if (el.type === 'highlighter') {
                targetCtx.globalAlpha = (el.opacity !== undefined ? el.opacity : 1.0) * 0.35;
                targetCtx.lineWidth = el.size * 3;
            }

            targetCtx.beginPath();

            if (['pen', 'highlighter'].includes(el.type)) {
                if (el.points && el.points.length > 0) {
                    targetCtx.moveTo(el.points[0].x, el.points[0].y);
                    for (let i = 1; i < el.points.length; i++) {
                        targetCtx.lineTo(el.points[i].x, el.points[i].y);
                    }
                    targetCtx.stroke();
                }
            } else if (el.type === 'line') {
                targetCtx.moveTo(el.x1, el.y1); targetCtx.lineTo(el.x2, el.y2); targetCtx.stroke();
            } else if (el.type === 'arrow') {
                const headlen = 14;
                const angle = Math.atan2(el.y2 - el.y1, el.x2 - el.x1);
                targetCtx.moveTo(el.x1, el.y1); targetCtx.lineTo(el.x2, el.y2); targetCtx.stroke();
                targetCtx.beginPath();
                targetCtx.moveTo(el.x2, el.y2);
                targetCtx.lineTo(el.x2 - headlen * Math.cos(angle - Math.PI / 6), el.y2 - headlen * Math.sin(angle - Math.PI / 6));
                targetCtx.lineTo(el.x2 - headlen * Math.cos(angle + Math.PI / 6), el.y2 - headlen * Math.sin(angle + Math.PI / 6));
                targetCtx.closePath();
                targetCtx.fill();
            } else if (el.type === 'rect') {
                targetCtx.strokeRect(el.x, el.y, el.w, el.h);
            } else if (el.type === 'circle') {
                const r = Math.hypot(el.w, el.h);
                targetCtx.arc(el.x, el.y, r, 0, Math.PI * 2);
                targetCtx.stroke();
            } else if (el.type === 'text') {
                targetCtx.font = `${Math.max(16, el.size * 4)}px sans-serif`;
                targetCtx.fillText(el.text || 'Text', el.x, el.y);
            } else if (el.type === 'image') {
                if (el.imgElement && el.imgElement.complete) {
                    targetCtx.drawImage(el.imgElement, el.x, el.y, el.w, el.h);
                } else if (!el.imgElement && el.src) {
                    const img = new Image();
                    img.src = el.src;
                    img.onload = () => requestRender();
                    el.imgElement = img;
                }
            }

            if (isSelected) {
                const b = getElementBounds(el);
                targetCtx.save();
                targetCtx.strokeStyle = '#6366f1';
                targetCtx.lineWidth = 2 / scale;
                targetCtx.setLineDash([6 / scale, 6 / scale]);
                targetCtx.strokeRect(b.x - 6, b.y - 6, b.w + 12, b.h + 12);
                targetCtx.restore();
            }

            targetCtx.restore();
        }

        function getElementBounds(el) {
            if (['pen', 'highlighter'].includes(el.type)) {
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                (el.points || []).forEach(p => {
                    minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
                    minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
                });
                return { x: minX, y: minY, w: (maxX - minX) || 10, h: (maxY - minY) || 10 };
            } else if (['line', 'arrow'].includes(el.type)) {
                return {
                    x: Math.min(el.x1, el.x2),
                    y: Math.min(el.y1, el.y2),
                    w: Math.abs(el.x2 - el.x1) || 10,
                    h: Math.abs(el.y2 - el.y1) || 10
                };
            } else if (['rect', 'sticky', 'image'].includes(el.type)) {
                return { x: el.x, y: el.y, w: el.w, h: el.h };
            } else if (el.type === 'circle') {
                const r = Math.hypot(el.w, el.h);
                return { x: el.x - r, y: el.y - r, w: r * 2, h: r * 2 };
            } else if (el.type === 'text') {
                return { x: el.x, y: el.y - 20, w: (el.text ? el.text.length : 4) * 12, h: 24 };
            }
            return { x: 0, y: 0, w: 0, h: 0 };
        }

        function renderHTMLOverlay() {
            htmlOverlay.innerHTML = '';
            elements.forEach((el, index) => {
                if (el.type === 'sticky') {
                    const screenPos = worldToScreen(el.x, el.y);
                    const card = document.createElement('div');
                    card.className = 'absolute rounded-2xl p-3 shadow-2xl border flex flex-col pointer-events-auto transition-shadow';
                    
                    card.style.transformOrigin = 'top left';
                    card.style.transform = `translate(${screenPos.x}px, ${screenPos.y}px) scale(${scale})`;
                    card.style.width = `${el.w}px`;
                    card.style.height = `${el.h}px`;
                    card.style.backgroundColor = el.color;
                    card.style.opacity = el.opacity !== undefined ? el.opacity : 1.0;
                    card.style.borderColor = selectedElementIndices.includes(index) ? '#6366f1' : 'rgba(0,0,0,0.1)';
                    if (selectedElementIndices.includes(index)) {
                        card.style.boxShadow = '0 0 0 2px #6366f1';
                    }

                    const textarea = document.createElement('textarea');
                    textarea.className = 'sticky-note-input custom-scrollbar font-medium';
                    textarea.style.fontSize = '14px';
                    textarea.value = el.text || '';
                    textarea.placeholder = 'Type note...';
                    
                    textarea.addEventListener('input', (e) => {
                        el.text = e.target.value;
                        saveStorage();
                    });
                    textarea.addEventListener('focus', () => {
                        selectedElementIndices = [index];
                        updateUIState();
                        requestRender();
                    });

                    card.appendChild(textarea);
                    htmlOverlay.appendChild(card);
                }
            });
        }

        function createActiveElement() {
            if (currentPath.length === 0) return null;
            const p1 = snapPoint(currentPath[0]);
            const p2 = snapPoint(currentPath[currentPath.length - 1]);

            if (['pen', 'highlighter'].includes(activeTool)) {
                return { type: activeTool, points: [...currentPath], color: strokeColor, size: strokeWidth, opacity: strokeOpacity };
            } else if (activeTool === 'line') {
                return { type: 'line', x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, color: strokeColor, size: strokeWidth, opacity: strokeOpacity };
            } else if (activeTool === 'arrow') {
                return { type: 'arrow', x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, color: strokeColor, size: strokeWidth, opacity: strokeOpacity };
            } else if (activeTool === 'rect') {
                return { type: 'rect', x: Math.min(p1.x, p2.x), y: Math.min(p1.y, p2.y), w: Math.abs(p2.x - p1.x), h: Math.abs(p2.y - p1.y), color: strokeColor, size: strokeWidth, opacity: strokeOpacity };
            } else if (activeTool === 'circle') {
                return { type: 'circle', x: p1.x, y: p1.y, w: p2.x - p1.x, h: p2.y - p1.y, color: strokeColor, size: strokeWidth, opacity: strokeOpacity };
            }
            return null;
        }

        function hitTest(worldPt) {
            for (let i = elements.length - 1; i >= 0; i--) {
                const b = getElementBounds(elements[i]);
                if (worldPt.x >= b.x && worldPt.x <= b.x + b.w && worldPt.y >= b.y && worldPt.y <= b.y + b.h) {
                    return i;
                }
            }
            return -1;
        }

        function eraseAtPoint(worldPt) {
            const hitIndex = hitTest(worldPt);
            if (hitIndex !== -1) {
                pushState();
                elements.splice(hitIndex, 1);
                selectedElementIndices = selectedElementIndices.filter(idx => idx !== hitIndex).map(idx => idx > hitIndex ? idx - 1 : idx);
                updateUIState();
                requestRender();
            }
        }

        // Pointer & Gesture Event Engine
        function handlePointerStart(e) {
            if (e.touches && e.touches.length === 2) {
                isDrawing = false;
                isPanning = true;
                isLassoing = false;
                const touch1 = e.touches[0];
                const touch2 = e.touches[1];
                initialPinchDistance = Math.hypot(touch2.clientX - touch1.clientX, touch2.clientY - touch1.clientY);
                initialPinchScale = scale;
                return;
            }

            const { screenX, screenY, world } = getEventCoords(e);

            if (activeTool === 'pan' || isSpacePressed || e.button === 1) {
                isPanning = true;
                startPanX = screenX - panX;
                startPanY = screenY - panY;
                return;
            }

            if (activeTool === 'select') {
                const hitIndex = hitTest(world);
                if (hitIndex !== -1) {
                    if (!e.shiftKey && !selectedElementIndices.includes(hitIndex)) {
                        selectedElementIndices = [hitIndex];
                    } else if (e.shiftKey && !selectedElementIndices.includes(hitIndex)) {
                        selectedElementIndices.push(hitIndex);
                    }
                    isDraggingElement = true;
                    dragOffsets = selectedElementIndices.map(idx => {
                        const b = getElementBounds(elements[idx]);
                        return { x: world.x - b.x, y: world.y - b.y };
                    });
                } else {
                    if (!e.shiftKey) selectedElementIndices = [];
                    isLassoing = true;
                    lassoStart = world;
                    lassoCurrent = world;
                }
                updateUIState();
                requestRender();
                return;
            }

            if (activeTool === 'eraser') {
                isDrawing = true;
                eraseAtPoint(world);
                return;
            }

            if (activeTool === 'laser') {
                isDrawing = true;
                laserTrail.push({ x: world.x, y: world.y, alpha: 1 });
                requestRender();
                return;
            }

            if (activeTool === 'text') {
                pushState();
                const textVal = prompt('Enter text note:', 'Sample Note');
                if (textVal) {
                    const spt = snapPoint(world);
                    elements.push({ type: 'text', x: spt.x, y: spt.y, text: textVal, color: strokeColor, size: strokeWidth, opacity: strokeOpacity });
                }
                requestRender();
                return;
            }

            if (activeTool === 'sticky') {
                pushState();
                const spt = snapPoint(world);
                elements.push({ type: 'sticky', x: spt.x, y: spt.y, w: 180, h: 160, text: '', color: strokeColor === '#ffffff' ? '#fef08a' : strokeColor, opacity: strokeOpacity });
                requestRender();
                return;
            }

            isDrawing = true;
            currentPath = [world];
        }

        function handlePointerMove(e) {
            if (e.touches && e.touches.length === 2 && isPanning) {
                const touch1 = e.touches[0];
                const touch2 = e.touches[1];
                const currentDistance = Math.hypot(touch2.clientX - touch1.clientX, touch2.clientY - touch1.clientY);
                
                if (initialPinchDistance) {
                    const factor = currentDistance / initialPinchDistance;
                    const targetScale = initialPinchScale * factor;
                    const center = {
                        x: (touch1.clientX + touch2.clientX) / 2,
                        y: (touch1.clientY + touch2.clientY) / 2
                    };
                    zoomAtPoint(targetScale, center.x, center.y);
                }
                return;
            }

            const { screenX, screenY, world } = getEventCoords(e);

            if (isPanning) {
                panX = screenX - startPanX;
                panY = screenY - startPanY;
                requestRender();
                return;
            }

            if (isLassoing) {
                lassoCurrent = world;
                const lx = Math.min(lassoStart.x, lassoCurrent.x);
                const ly = Math.min(lassoStart.y, lassoCurrent.y);
                const lw = Math.abs(lassoCurrent.x - lassoStart.x);
                const lh = Math.abs(lassoCurrent.y - lassoStart.y);

                selectedElementIndices = [];
                elements.forEach((el, index) => {
                    const b = getElementBounds(el);
                    if (b.x >= lx && b.x + b.w <= lx + lw && b.y >= ly && b.y + b.h <= ly + lh) {
                        selectedElementIndices.push(index);
                    }
                });
                updateUIState();
                requestRender();
                return;
            }

            if (isDraggingElement && selectedElementIndices.length > 0) {
                selectedElementIndices.forEach((idx, i) => {
                    const el = elements[idx];
                    const offset = dragOffsets[i];
                    if (!offset) return;
                    
                    let dx = world.x - offset.x;
                    let dy = world.y - offset.y;
                    dx = snapValue(dx);
                    dy = snapValue(dy);

                    if (['rect', 'text', 'sticky', 'image'].includes(el.type)) {
                        el.x = dx; el.y = dy;
                    } else if (['line', 'arrow'].includes(el.type)) {
                        const w = el.x2 - el.x1; const h = el.y2 - el.y1;
                        el.x1 = dx; el.y1 = dy; el.x2 = dx + w; el.y2 = dy + h;
                    } else if (el.type === 'circle') {
                        el.x = dx; el.y = dy;
                    } else if (['pen', 'highlighter'].includes(el.type)) {
                        const b = getElementBounds(el);
                        const shiftX = dx - b.x;
                        const shiftY = dy - b.y;
                        el.points.forEach(p => { p.x += shiftX; p.y += shiftY; });
                    }
                });
                requestRender();
                return;
            }

            if (!isDrawing) return;

            if (activeTool === 'eraser') {
                eraseAtPoint(world);
                return;
            }

            if (activeTool === 'laser') {
                laserTrail.push({ x: world.x, y: world.y, alpha: 1 });
                if (laserTrail.length > 30) laserTrail.shift();
                requestRender();
                return;
            }

            currentPath.push(world);
            requestRender();
        }

        function handlePointerEnd() {
            if (isPanning) {
                isPanning = false;
                initialPinchDistance = null;
                return;
            }

            if (isLassoing) {
                isLassoing = false;
                requestRender();
                return;
            }

            if (isDraggingElement) {
                isDraggingElement = false;
                pushState();
                return;
            }

            if (!isDrawing) return;
            isDrawing = false;

            if (activeTool === 'laser') {
                const fadeInterval = setInterval(() => {
                    laserTrail.forEach(pt => pt.alpha -= 0.08);
                    laserTrail = laserTrail.filter(pt => pt.alpha > 0);
                    requestRender();
                    if (laserTrail.length === 0) clearInterval(fadeInterval);
                }, 30);
                return;
            }

            if (activeTool === 'auto-shape') {
                processSmartAutoShape(currentPath);
                currentPath = [];
                return;
            }

            const newEl = createActiveElement();
            if (newEl) {
                pushState();
                elements.push(newEl);
            }

            currentPath = [];
            requestRender();
        }

        function processSmartAutoShape(pts) {
            if (pts.length < 5) return;
            pushState();

            const first = pts[0];
            const last = pts[pts.length - 1];
            const isClosed = Math.hypot(last.x - first.x, last.y - first.y) < 60;

            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            pts.forEach(p => {
                minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
                minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
            });

            const w = maxX - minX;
            const h = maxY - minY;

            if (isClosed) {
                elements.push({
                    type: 'circle',
                    x: minX + w / 2,
                    y: minY + h / 2,
                    w: w / 2,
                    h: h / 2,
                    color: strokeColor,
                    size: strokeWidth,
                    opacity: strokeOpacity
                });
            } else {
                elements.push({
                    type: 'line',
                    x1: first.x,
                    y1: first.y,
                    x2: last.x,
                    y2: last.y,
                    color: strokeColor,
                    size: strokeWidth,
                    opacity: strokeOpacity
                });
            }
            requestRender();
        }

        function zoomAtPoint(newScale, sx, sy) {
            const clampedScale = Math.min(Math.max(0.15, newScale), 6);
            const world = screenToWorld(sx, sy);
            scale = clampedScale;
            panX = sx - world.x * scale;
            panY = sy - world.y * scale;

            const zoomEl = document.getElementById('zoom-level');
            if (zoomEl) zoomEl.textContent = `${Math.round(scale * 100)}%`;
            requestRender();
        }

        function fitViewToContent() {
            if (elements.length === 0) {
                panX = 0; panY = 0; scale = 1;
                zoomAtPoint(1, 0, 0);
                return;
            }
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            elements.forEach(el => {
                const b = getElementBounds(el);
                minX = Math.min(minX, b.x);
                maxX = Math.max(maxX, b.x + b.w);
                minY = Math.min(minY, b.y);
                maxY = Math.max(maxY, b.y + b.h);
            });
            const contentW = maxX - minX || 100;
            const contentH = maxY - minY || 100;
            const padding = 80;

            const targetScale = Math.min(
                (canvas.width - padding * 2) / contentW,
                (canvas.height - padding * 2) / contentH,
                2.0
            );

            scale = Math.max(0.2, targetScale);
            panX = (canvas.width - contentW * scale) / 2 - minX * scale;
            panY = (canvas.height - contentH * scale) / 2 - minY * scale;

            const zoomEl = document.getElementById('zoom-level');
            if (zoomEl) zoomEl.textContent = `${Math.round(scale * 100)}%`;
            requestRender();
        }

        // Image Handling
        function handleImageFile(file) {
            if (!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const img = new Image();
                img.onload = () => {
                    pushState();
                    const aspect = img.width / img.height;
                    const w = Math.min(400, img.width);
                    const h = w / aspect;
                    const center = screenToWorld(canvas.width / 2, canvas.height / 2);
                    elements.push({
                        type: 'image',
                        x: center.x - w / 2,
                        y: center.y - h / 2,
                        w, h,
                        src: evt.target.result,
                        imgElement: img,
                        color: '#000000',
                        size: 1,
                        opacity: 1.0
                    });
                    requestRender();
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }

        imageUploadBtn.addEventListener('click', () => imageInput.click());
        imageInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleImageFile(e.target.files[0]);
                imageInput.value = '';
            }
        });

        // Drag & Drop Image onto Canvas
        container.addEventListener('dragover', (e) => e.preventDefault());
        container.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                handleImageFile(e.dataTransfer.files[0]);
            }
        });

        // Attach Canvas Interaction Handlers
        canvas.addEventListener('mousedown', handlePointerStart);
        canvas.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerEnd);

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1 || activeTool !== 'pan') e.preventDefault();
            handlePointerStart(e);
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length > 1 || activeTool !== 'pan') e.preventDefault();
            handlePointerMove(e);
        }, { passive: false });

        window.addEventListener('touchend', handlePointerEnd);

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.ctrlKey || e.metaKey) {
                const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
                zoomAtPoint(scale * zoomFactor, e.clientX, e.clientY);
            } else {
                panX -= e.deltaX;
                panY -= e.deltaY;
                requestRender();
            }
        }, { passive: false });

        // Tool Switching & Synchronization
        const toolsList = ['select', 'pan', 'laser', 'pen', 'eraser', 'highlighter', 'auto-shape', 'text', 'sticky', 'line', 'arrow', 'rect', 'circle'];
        
        function setTool(toolName) {
            activeTool = toolName;
            selectedElementIndices = [];

            toolsList.forEach(t => {
                const b = document.getElementById(`tool-${t}`);
                if (b) {
                    if (t === toolName) b.classList.add('active-tool');
                    else b.classList.remove('active-tool');
                }
            });

            document.querySelectorAll('.m-tool-btn').forEach(btn => {
                if (btn.getAttribute('data-tool') === toolName) {
                    btn.classList.remove('bg-slate-800', 'text-slate-300');
                    btn.classList.add('bg-indigo-600', 'text-white');
                } else {
                    btn.classList.remove('bg-indigo-600', 'text-white');
                    btn.classList.add('bg-slate-800', 'text-slate-300');
                }
            });

            document.querySelectorAll('.m-sheet-btn').forEach(btn => {
                if (btn.getAttribute('data-tool') === toolName) {
                    btn.classList.remove('bg-slate-800', 'text-slate-300');
                    btn.classList.add('bg-indigo-600', 'text-white');
                } else {
                    btn.classList.remove('bg-indigo-600', 'text-white');
                    btn.classList.add('bg-slate-800', 'text-slate-300');
                }
            });

            canvas.style.cursor = toolName === 'pan' ? 'grab' : toolName === 'select' ? 'default' : 'crosshair';
            updateUIState();
            requestRender();
        }

        toolsList.forEach(t => {
            const btn = document.getElementById(`tool-${t}`);
            if (btn) btn.addEventListener('click', () => setTool(t));
        });

        document.querySelectorAll('.m-tool-btn, .m-sheet-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                setTool(btn.getAttribute('data-tool'));
                toggleMobileSheet(false);
            });
        });

        function toggleMobileSheet(force) {
            const isHidden = mobileSheet.classList.contains('translate-y-full');
            const show = force !== undefined ? force : isHidden;
            if (show) {
                mobileSheet.classList.remove('translate-y-full');
                mPropsCard.classList.add('hidden');
            } else {
                mobileSheet.classList.add('translate-y-full');
            }
        }
        
        mobileMenuBtn.addEventListener('click', () => toggleMobileSheet());
        if (closeMobileSheetBtn) closeMobileSheetBtn.addEventListener('click', () => toggleMobileSheet(false));

        mPropsToggle.addEventListener('click', () => {
            mPropsCard.classList.toggle('hidden');
        });

        function toggleTheme() {
            isDarkModeBoard = !isDarkModeBoard;
            const icon = isDarkModeBoard ? 'sun' : 'moon';
            themeBtn.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5"></i>`;
            mobileThemeBtn.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4"></i><span>Toggle View</span>`;

            if (!isDarkModeBoard && strokeColor === '#ffffff') {
                syncColor('#020617');
            } else if (isDarkModeBoard && strokeColor === '#020617') {
                syncColor('#ffffff');
            }

            lucide.createIcons();
            requestRender();
        }
        themeBtn.addEventListener('click', toggleTheme);
        mobileThemeBtn.addEventListener('click', toggleTheme);

        // Zoom Operations
        const zIn = document.getElementById('zoom-in-btn');
        const zOut = document.getElementById('zoom-out-btn');
        const zReset = document.getElementById('zoom-reset-btn');
        const fitBtn = document.getElementById('fit-view-btn');

        if (zIn) zIn.addEventListener('click', () => zoomAtPoint(scale * 1.2, canvas.width / 2, canvas.height / 2));
        if (zOut) zOut.addEventListener('click', () => zoomAtPoint(scale / 1.2, canvas.width / 2, canvas.height / 2));
        if (zReset) zReset.addEventListener('click', () => { panX = 0; panY = 0; zoomAtPoint(1, 0, 0); });
        if (fitBtn) fitBtn.addEventListener('click', fitViewToContent);

        // Dynamic Color History & Opacity Management
        function renderColorSwatches() {
            const deskContainer = document.getElementById('color-history-container');
            const mobContainer = document.getElementById('m-color-history-container');

            const renderToContainer = (target) => {
                if (!target) return;
                target.innerHTML = '';
                recentColors.forEach(c => {
                    const btn = document.createElement('button');
                    btn.className = `w-6 h-6 rounded-full border border-slate-600 transition active:scale-90 ${strokeColor === c ? 'ring-2 ring-indigo-500' : ''}`;
                    btn.style.backgroundColor = c;
                    btn.addEventListener('click', () => syncColor(c));
                    target.appendChild(btn);
                });
            };

            renderToContainer(deskContainer);
            renderToContainer(mobContainer);
        }

        function syncColor(val) {
            strokeColor = val;
            colorPicker.value = val;
            mColorPicker.value = val;

            if (!recentColors.includes(val)) {
                recentColors.unshift(val);
                if (recentColors.length > 6) recentColors.pop();
            }
            renderColorSwatches();
        }

        function syncSize(val) {
            strokeWidth = parseInt(val);
            sizePicker.value = strokeWidth;
            mSizePicker.value = strokeWidth;
            sizePreview.textContent = `${strokeWidth}px`;
            mSizePreview.textContent = `${strokeWidth}p`;
        }

        function syncOpacity(val) {
            strokeOpacity = parseFloat(val);
            opacityPicker.value = strokeOpacity;
            mOpacityPicker.value = strokeOpacity;
            opacityPreview.textContent = `${Math.round(strokeOpacity * 100)}%`;
            mOpacityPreview.textContent = `${Math.round(strokeOpacity * 100)}%`;
        }

        colorPicker.addEventListener('input', (e) => syncColor(e.target.value));
        mColorPicker.addEventListener('input', (e) => syncColor(e.target.value));

        sizePicker.addEventListener('input', (e) => syncSize(e.target.value));
        mSizePicker.addEventListener('input', (e) => syncSize(e.target.value));

        opacityPicker.addEventListener('input', (e) => syncOpacity(e.target.value));
        mOpacityPicker.addEventListener('input', (e) => syncOpacity(e.target.value));

        gridSelect.addEventListener('change', (e) => {
            activeGridPattern = e.target.value;
            requestRender();
        });

        snapGridBtn.addEventListener('click', () => {
            isSnapToGrid = !isSnapToGrid;
            snapStatus.textContent = `Snap: ${isSnapToGrid ? 'On' : 'Off'}`;
            snapGridBtn.classList.toggle('bg-indigo-600', isSnapToGrid);
            snapGridBtn.classList.toggle('text-white', isSnapToGrid);
            snapGridBtn.classList.toggle('bg-slate-800', !isSnapToGrid);
            snapGridBtn.classList.toggle('text-slate-300', !isSnapToGrid);
        });

        // Actions & Command History
        undoBtn.addEventListener('click', () => {
            if (undoStack.length > 0) {
                const snapshot = elements.map(el => {
                    if (el.type === 'image') {
                        const { imgElement, ...rest } = el;
                        return rest;
                    }
                    return el;
                });
                redoStack.push(JSON.stringify(snapshot));
                elements = JSON.parse(undoStack.pop());
                elements.forEach(el => {
                    if (el.type === 'image' && el.src) {
                        const img = new Image();
                        img.src = el.src;
                        el.imgElement = img;
                    }
                });
                selectedElementIndices = [];
                updateUIState();
                saveStorage();
                requestRender();
            }
        });

        redoBtn.addEventListener('click', () => {
            if (redoStack.length > 0) {
                const snapshot = elements.map(el => {
                    if (el.type === 'image') {
                        const { imgElement, ...rest } = el;
                        return rest;
                    }
                    return el;
                });
                undoStack.push(JSON.stringify(snapshot));
                elements = JSON.parse(redoStack.pop());
                elements.forEach(el => {
                    if (el.type === 'image' && el.src) {
                        const img = new Image();
                        img.src = el.src;
                        el.imgElement = img;
                    }
                });
                selectedElementIndices = [];
                updateUIState();
                saveStorage();
                requestRender();
            }
        });

        duplicateBtn.addEventListener('click', () => {
            if (selectedElementIndices.length > 0) {
                pushState();
                const newIndices = [];
                selectedElementIndices.forEach(idx => {
                    const dup = JSON.parse(JSON.stringify(elements[idx]));
                    if (dup.x !== undefined) dup.x += 20;
                    if (dup.y !== undefined) dup.y += 20;
                    if (dup.x1 !== undefined) { dup.x1 += 20; dup.x2 += 20; dup.y1 += 20; dup.y2 += 20; }
                    if (dup.type === 'image' && dup.src) {
                        const img = new Image();
                        img.src = dup.src;
                        dup.imgElement = img;
                    }
                    elements.push(dup);
                    newIndices.push(elements.length - 1);
                });
                selectedElementIndices = newIndices;
                updateUIState();
                requestRender();
            }
        });

        deleteSelectedBtn.addEventListener('click', () => {
            if (selectedElementIndices.length > 0) {
                pushState();
                elements = elements.filter((_, idx) => !selectedElementIndices.includes(idx));
                selectedElementIndices = [];
                updateUIState();
                requestRender();
            }
        });

        document.getElementById('clear-btn').addEventListener('click', () => {
            if (confirm('Clear the canvas?')) {
                pushState();
                elements = [];
                selectedElementIndices = [];
                updateUIState();
                requestRender();
            }
        });

        // Complete Content PNG Exporter
        document.getElementById('export-btn').addEventListener('click', () => {
            if (elements.length === 0) {
                alert("Canvas is empty. Draw something before exporting!");
                return;
            }

            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            elements.forEach(el => {
                const b = getElementBounds(el);
                minX = Math.min(minX, b.x);
                maxX = Math.max(maxX, b.x + b.w);
                minY = Math.min(minY, b.y);
                maxY = Math.max(maxY, b.y + b.h);
            });

            const padding = 50;
            minX -= padding; minY -= padding;
            maxX += padding; maxY += padding;

            const exportW = Math.max(800, maxX - minX);
            const exportH = Math.max(600, maxY - minY);

            const expCanvas = document.createElement('canvas');
            expCanvas.width = exportW;
            expCanvas.height = exportH;
            const expCtx = expCanvas.getContext('2d');

            renderGrid(expCtx, exportW, exportH, -minX, -minY, 1);

            expCtx.save();
            expCtx.translate(-minX, -minY);

            elements.forEach(el => {
                drawElement(expCtx, el, false);
                if (el.type === 'sticky') {
                    expCtx.save();
                    expCtx.globalAlpha = el.opacity !== undefined ? el.opacity : 1.0;
                    expCtx.fillStyle = el.color;
                    expCtx.fillRect(el.x, el.y, el.w, el.h);
                    expCtx.strokeStyle = 'rgba(0,0,0,0.1)';
                    expCtx.strokeRect(el.x, el.y, el.w, el.h);
                    
                    expCtx.fillStyle = '#0f172a';
                    expCtx.font = '14px sans-serif';
                    
                    const words = (el.text || '').split(' ');
                    let line = '';
                    let lineY = el.y + 24;
                    for (let n = 0; n < words.length; n++) {
                        let testLine = line + words[n] + ' ';
                        let metrics = expCtx.measureText(testLine);
                        if (metrics.width > el.w - 20 && n > 0) {
                            expCtx.fillText(line, el.x + 10, lineY);
                            line = words[n] + ' ';
                            lineY += 18;
                        } else {
                            line = testLine;
                        }
                    }
                    expCtx.fillText(line, el.x + 10, lineY);
                    expCtx.restore();
                }
            });

            expCtx.restore();

            const a = document.createElement('a');
            a.download = `whiteboard-${Date.now()}.png`;
            a.href = expCanvas.toDataURL('image/png');
            a.click();
        });

        // Global Shortcuts Listener
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            if (e.code === 'Space') {
                isSpacePressed = true;
                canvas.style.cursor = 'grab';
            }
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z' || e.key === 'Z') { e.preventDefault(); undoBtn.click(); }
                if (e.key === 'y' || e.key === 'Y') { e.preventDefault(); redoBtn.click(); }
                if (e.key === 'd' || e.key === 'D') { e.preventDefault(); duplicateBtn.click(); }
            } else {
                if (e.key === 'v' || e.key === 'V') setTool('select');
                if (e.key === 'p' || e.key === 'P') setTool('pen');
                if (e.key === 'e' || e.key === 'E') setTool('eraser');
                if (e.key === 'h' || e.key === 'H') setTool('highlighter');
                if (e.key === 'l' || e.key === 'L') setTool('laser');
                if (e.key === 't' || e.key === 'T') setTool('text');
                if (e.key === 's' || e.key === 'S') setTool('sticky');
                if (e.key === 'Delete' || e.key === 'Backspace') deleteSelectedBtn.click();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                isSpacePressed = false;
                canvas.style.cursor = activeTool === 'pan' ? 'grab' : activeTool === 'select' ? 'default' : 'crosshair';
            }
        });

        window.addEventListener('resize', resizeCanvas);

        // App Initialization Sequence
        initStorage();
        renderColorSwatches();
        resizeCanvas();
        updateUIState();
    </script>
</body>
</html>
