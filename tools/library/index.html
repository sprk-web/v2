<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPRK-Web | Library</title>
    <link rel="icon" href="https://sprk-web.github.io/favicon.png" type="image/x-icon">
    <link rel="apple-touch-icon" href="https://sprk-web.github.io/favicon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            cyan: '#00f2fe',
                            blue: '#4facfe',
                            purple: '#7f00ff'
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .brand-main {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #7f00ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-sub::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: #00f2fe;
            border-radius: 50%;
            top: 25%;
            right: -10px;
            box-shadow: 0 0 8px #00f2fe, 0 0 15px #00f2fe;
            animation: pulse 2s infinite alternate;
        }

        .logo-underline {
            width: 25px;
            height: 3px;
            background: linear-gradient(90deg, #00f2fe, #7f00ff);
            margin-top: 2px;
            border-radius: 2px;
            box-shadow: 0 2px 6px rgba(0, 242, 254, 0.4);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .brand-logo-container:hover .logo-underline {
            width: 100%;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 1; }
        }

        /* Custom Scrollbar for Tags Bar */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
    <link rel="stylesheet" href="/site-theme.css">
    <script type="module" src="/js/site-theme.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-50 transition-colors duration-300 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

    <main id="main-content" class="flex-1 max-w-4xl w-full mx-auto px-6 py-8 flex flex-col items-center">
        
        <div id="loading-state" class="w-full flex flex-col gap-6 py-6 animate-pulse">
            <div class="h-12 bg-slate-200 dark:bg-slate-800/60 rounded-2xl w-full"></div>
            <div class="flex gap-2">
                <div class="h-8 bg-slate-200 dark:bg-slate-800/60 rounded-xl w-16"></div>
                <div class="h-8 bg-slate-200 dark:bg-slate-800/60 rounded-xl w-20"></div>
                <div class="h-8 bg-slate-200 dark:bg-slate-800/60 rounded-xl w-24"></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                <div class="h-20 bg-slate-200 dark:bg-slate-800/60 rounded-2xl w-full"></div>
                <div class="h-20 bg-slate-200 dark:bg-slate-800/60 rounded-2xl w-full"></div>
                <div class="h-20 bg-slate-200 dark:bg-slate-800/60 rounded-2xl w-full"></div>
                <div class="h-20 bg-slate-200 dark:bg-slate-800/60 rounded-2xl w-full"></div>
            </div>
        </div>

        <div id="error-state" class="hidden text-center max-w-md p-8 my-auto bg-white dark:bg-slate-900 border border-red-200 dark:border-red-900/40 rounded-3xl shadow-xl transition-all">
            <div class="w-12 h-12 rounded-2xl bg-red-50 dark:bg-red-950/50 text-red-500 flex items-center justify-center mx-auto mb-4">
                <i data-lucide="alert-circle" class="w-6 h-6"></i>
            </div>
            <h2 class="text-lg font-bold text-slate-900 dark:text-white mb-1">Failed to Sync Resources</h2>
            <p id="error-message" class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed mb-5">Resource directory index unreachable.</p>
            <button onclick="fetchData()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl shadow-md transition active:scale-95 cursor-pointer">
                Retry Connection
            </button>
        </div>

        <div id="content" class="hidden w-full flex flex-col gap-6 justify-start items-center">
            
            <div class="w-full flex flex-col gap-3">
                <div class="w-full relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-indigo-500 transition-colors">
                        <i data-lucide="search" class="w-4 h-4"></i>
                    </div>
                    <input type="text" id="search-filter" placeholder="Search resources or documents... (Press '/' to focus)" class="w-full p-3.5 pl-11 pr-20 border border-slate-200 dark:border-slate-800 rounded-2xl bg-white dark:bg-slate-900 shadow-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/80 focus:border-transparent dark:text-slate-100 transition duration-200 text-sm">
                    
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center gap-1.5">
                        <button id="clear-search" class="hidden p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition rounded-lg">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                        <kbd class="hidden sm:inline-block text-[10px] font-mono text-slate-400 dark:text-slate-500 border border-slate-200 dark:border-slate-800 rounded-md px-1.5 py-0.5 bg-slate-50 dark:bg-slate-950">⌘K</kbd>
                    </div>
                </div>

                <div class="flex items-center gap-2 overflow-x-auto pb-1 max-w-full no-scrollbar">
                    <button data-type="all" class="type-filter-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-indigo-600 text-white shadow-xs transition active:scale-95">All</button>
                    <button data-type="pinned" class="type-filter-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 transition active:scale-95 flex items-center gap-1.5">
                        <i data-lucide="pin" class="w-3 h-3 text-amber-500"></i> Pinned
                    </button>
                    <button data-type="site" class="type-filter-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 transition active:scale-95">Sites</button>
                    <button data-type="pdf" class="type-filter-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 transition active:scale-95">Documents</button>
                    <button data-type="media" class="type-filter-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 transition active:scale-95">Media</button>
                </div>
            </div>

            <div id="file-links" class="w-full flex flex-col gap-8">
                
                <div id="section-pinned" class="hidden flex flex-col gap-3.5 w-full">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 flex items-center justify-between px-1">
                        <span class="flex items-center gap-1.5">
                            <i data-lucide="pin" class="w-3.5 h-3.5 text-amber-500"></i> Pinned Resources
                        </span>
                        <span id="count-pinned" class="text-[11px] bg-amber-500/10 text-amber-500 px-2 py-0.5 rounded-full font-mono font-medium">0</span>
                    </h3>
                    <div id="file-links-pinned" class="w-full grid grid-cols-1 md:grid-cols-2 gap-3.5"></div>
                </div>

                <div id="section-site" class="hidden flex flex-col gap-3.5 w-full">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 flex items-center justify-between px-1">
                        <span class="flex items-center gap-1.5">
                            <i data-lucide="globe" class="w-3.5 h-3.5 text-indigo-500"></i> Sites & Links
                        </span>
                        <span id="count-site" class="text-[11px] bg-slate-200 dark:bg-slate-800 text-slate-500 px-2 py-0.5 rounded-full font-mono font-medium">0</span>
                    </h3>
                    <div id="file-links-site" class="w-full grid grid-cols-1 md:grid-cols-2 gap-3.5"></div>
                </div>
                
                <div id="section-pdf" class="hidden flex flex-col gap-3.5 w-full">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 flex items-center justify-between px-1">
                        <span class="flex items-center gap-1.5">
                            <i data-lucide="file-text" class="w-3.5 h-3.5 text-rose-500"></i> Documents
                        </span>
                        <span id="count-pdf" class="text-[11px] bg-slate-200 dark:bg-slate-800 text-slate-500 px-2 py-0.5 rounded-full font-mono font-medium">0</span>
                    </h3>
                    <div id="file-links-pdf" class="w-full grid grid-cols-1 md:grid-cols-2 gap-3.5"></div>
                </div>
                
                <div id="section-media" class="hidden flex flex-col gap-3.5 w-full">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 flex items-center justify-between px-1">
                        <span class="flex items-center gap-1.5">
                            <i data-lucide="image" class="w-3.5 h-3.5 text-emerald-500"></i> Media Assets
                        </span>
                        <span id="count-media" class="text-[11px] bg-slate-200 dark:bg-slate-800 text-slate-500 px-2 py-0.5 rounded-full font-mono font-medium">0</span>
                    </h3>
                    <div id="file-links-media" class="w-full grid grid-cols-1 md:grid-cols-2 gap-3.5"></div>
                </div>
            </div>
            
            <div id="no-results" class="hidden text-center py-16 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl w-full max-w-md shadow-xs my-6">
                <div class="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-400 flex items-center justify-center mx-auto mb-3">
                    <i data-lucide="folder-open" class="w-5 h-5 opacity-80"></i>
                </div>
                <h4 class="text-sm font-bold text-slate-800 dark:text-slate-200">No resources found</h4>
                <p class="text-xs text-slate-400 mt-1 max-w-xs mx-auto px-4 leading-relaxed">No matching assets found. Try adjusting your search query or filter types.</p>
            </div>
        </div>

    </main>

    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-16 opacity-0 transition-all duration-300 bg-slate-900 text-white dark:bg-white dark:text-slate-900 text-xs font-semibold px-4 py-3 rounded-2xl shadow-xl flex items-center gap-2 pointer-events-none z-50">
        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400 dark:text-emerald-600"></i>
        <span id="toast-message">Copied to clipboard</span>
    </div>

    <script>
        // -------------------------------------------------------------------
        // 1. Theme Engine Management
        // -------------------------------------------------------------------
        function initTheme() {
            const storedTheme = localStorage.getItem('theme');
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = storedTheme === 'dark' || (!storedTheme && systemDark);

            document.documentElement.classList.toggle('dark', isDark);
        }

        // -------------------------------------------------------------------
        // 2. Data Pipeline & Favorites Engine
        // -------------------------------------------------------------------
        let resourceData = [];
        let activeCategoryFilter = 'all';
        const targetedSections = ["pinned", "site", "pdf", "media"];

        function getPinnedItems() {
            try {
                return JSON.parse(localStorage.getItem('pinned_resources') || '[]');
            } catch (e) {
                return [];
            }
        }

        function togglePin(path) {
            let pins = getPinnedItems();
            pins = pins.includes(path) ? pins.filter(p => p !== path) : [...pins, path];
            localStorage.setItem('pinned_resources', JSON.stringify(pins));
            renderResources(document.getElementById('search-filter').value);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const msgSpan = document.getElementById('toast-message');
            msgSpan.textContent = message;
            
            toast.classList.remove('translate-y-16', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-16', 'opacity-0');
            }, 2000);
        }

        function copyLinkToClipboard(url) {
            navigator.clipboard.writeText(url).then(() => {
                showToast("Resource URL copied to clipboard!");
            }).catch(() => {
                showToast("Failed to copy URL.");
            });
        }

        function fetchData() {
            document.getElementById('error-state').classList.add('hidden');
            document.getElementById('content').classList.add('hidden');
            document.getElementById('loading-state').classList.remove('hidden');

            const url = 'https://sprk-web.github.io/resources/resources.json';
            
            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response.json();
                })
                .then(data => {
                    resourceData = Array.isArray(data) ? data : [];
                    document.getElementById('loading-state').classList.add('hidden');
                    document.getElementById('content').classList.remove('hidden');
                    renderResources();
                })
                .catch(error => {
                    console.error("Data tracking failure:", error);
                    document.getElementById('loading-state').classList.add('hidden');
                    document.getElementById('error-state').classList.remove('hidden');
                });
        }

        function renderResources(filter = '') {
            const pinnedPaths = getPinnedItems();
            const sectionCounts = { pinned: 0, site: 0, pdf: 0, media: 0 };

            // Clear sections
            targetedSections.forEach(section => {
                const innerContainer = document.getElementById(`file-links-${section}`);
                if (innerContainer) innerContainer.innerHTML = '';
                
                const frameWrapper = document.getElementById(`section-${section}`);
                if (frameWrapper) frameWrapper.classList.add('hidden');
            });

            let matchCounter = 0;
            const cleanFilter = filter.trim().toLowerCase();

            const badgeStylingMap = {
                site: 'text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-950/40 border-indigo-100 dark:border-indigo-900/30',
                pdf: 'text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/40 border-rose-100 dark:border-rose-900/30',
                media: 'text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/40 border-emerald-100 dark:border-emerald-900/30'
            };

            const actionBtnIconMap = {
                site: 'external-link',
                pdf: 'download',
                media: 'maximize-2'
            };

            resourceData.forEach(asset => {
                if (!asset || !asset.name || !asset.path) return;

                const normalizedType = (asset.type || 'site').toLowerCase();
                const isPinned = pinnedPaths.includes(asset.path);

                // Quick Filter Checks
                if (activeCategoryFilter === 'pinned' && !isPinned) return;
                if (activeCategoryFilter !== 'all' && activeCategoryFilter !== 'pinned' && normalizedType !== activeCategoryFilter) return;

                // Search Term Check
                if (cleanFilter && !asset.name.toLowerCase().includes(cleanFilter) && !normalizedType.includes(cleanFilter)) {
                    return;
                }

                matchCounter++;

                // Build Item Card Container
                const card = document.createElement('div');
                card.className = 'w-full p-3.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800/80 hover:border-indigo-500/50 dark:hover:border-indigo-500/40 rounded-2xl flex flex-row items-center justify-between gap-3 shadow-xs hover:shadow-md transition-all duration-200 group';
                
                // Content Meta Container
                const metaBlock = document.createElement('div');
                metaBlock.className = 'flex flex-col gap-1 min-w-0 flex-1';
                
                const tag = document.createElement('span');
                tag.textContent = normalizedType.toUpperCase();
                tag.className = `text-[9px] font-bold tracking-wider px-2 py-0.5 rounded-md w-fit border select-none ${badgeStylingMap[normalizedType] || 'text-slate-600 bg-slate-100 border-slate-200'}`;
                
                const titleText = document.createElement('h4');
                titleText.textContent = asset.name;
                titleText.title = asset.name;
                titleText.className = 'text-xs sm:text-sm font-semibold text-slate-800 dark:text-slate-100 truncate group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors duration-200';
                
                metaBlock.appendChild(tag);
                metaBlock.appendChild(titleText);

                // Right Side Actions Block
                const controlsBlock = document.createElement('div');
                controlsBlock.className = 'flex items-center gap-1.5 shrink-0';

                // Pin Action Button
                const pinBtn = document.createElement('button');
                pinBtn.type = 'button';
                pinBtn.setAttribute('aria-label', 'Pin item');
                pinBtn.className = `p-2 rounded-xl border transition active:scale-90 ${isPinned ? 'bg-amber-50 dark:bg-amber-950/30 border-amber-200 dark:border-amber-800/60 text-amber-500' : 'border-slate-200 dark:border-slate-800 text-slate-400 hover:text-amber-500 hover:bg-slate-50 dark:hover:bg-slate-800'}`;
                pinBtn.innerHTML = `<i data-lucide="pin" class="w-3.5 h-3.5 ${isPinned ? 'fill-amber-500' : ''}"></i>`;
                pinBtn.onclick = (e) => {
                    e.preventDefault();
                    togglePin(asset.path);
                };

                // Copy Action Button
                const copyBtn = document.createElement('button');
                copyBtn.type = 'button';
                copyBtn.setAttribute('aria-label', 'Copy link');
                copyBtn.className = 'p-2 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-400 hover:text-indigo-500 dark:hover:text-indigo-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition active:scale-90';
                copyBtn.innerHTML = `<i data-lucide="copy" class="w-3.5 h-3.5"></i>`;
                copyBtn.onclick = (e) => {
                    e.preventDefault();
                    copyLinkToClipboard(asset.path);
                };

                // Open External Anchor Link
                const linkAnchor = document.createElement('a');
                linkAnchor.href = asset.path;
                linkAnchor.target = "_blank";
                linkAnchor.rel = "noopener noreferrer";
                linkAnchor.className = 'inline-flex items-center gap-1 px-3 py-2 text-xs font-semibold text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800/60 rounded-xl border border-slate-200/80 dark:border-slate-700/60 hover:bg-indigo-600 dark:hover:bg-indigo-600 hover:text-white dark:hover:text-white hover:border-transparent transition-all duration-200 shrink-0 shadow-2xs active:scale-95';
                const actionIconStr = actionBtnIconMap[normalizedType] || 'external-link';
                linkAnchor.innerHTML = `<span>Open</span> <i data-lucide="${actionIconStr}" class="w-3 h-3"></i>`;

                controlsBlock.appendChild(pinBtn);
                controlsBlock.appendChild(copyBtn);
                controlsBlock.appendChild(linkAnchor);

                card.appendChild(metaBlock);
                card.appendChild(controlsBlock);

                // Section Distribution
                const targetType = isPinned && activeCategoryFilter === 'all' ? 'pinned' : normalizedType;
                const targetGridList = document.getElementById(`file-links-${targetType}`);
                
                if (targetGridList) {
                    targetGridList.appendChild(card);
                    sectionCounts[targetType]++;
                    const parentSectionWrapper = document.getElementById(`section-${targetType}`);
                    if (parentSectionWrapper) parentSectionWrapper.classList.remove('hidden');
                }
            });

            // Update Metrics Badges
            targetedSections.forEach(sec => {
                const countBadge = document.getElementById(`count-${sec}`);
                if (countBadge) countBadge.textContent = sectionCounts[sec];
            });

            // Toggle Search Empty Fallback
            document.getElementById('no-results').classList.toggle('hidden', matchCounter > 0);

            if (window.lucide) lucide.createIcons();
        }

        // -------------------------------------------------------------------
        // 3. Global Listeners & Keyboard Shortcuts
        // -------------------------------------------------------------------
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            fetchData();

            const liveSearchFilterInput = document.getElementById('search-filter');
            const clearSearchBtn = document.getElementById('clear-search');

            liveSearchFilterInput.addEventListener('input', (event) => {
                const val = event.target.value;
                clearSearchBtn.classList.toggle('hidden', !val);
                renderResources(val);
            });

            clearSearchBtn.addEventListener('click', () => {
                liveSearchFilterInput.value = '';
                clearSearchBtn.classList.add('hidden');
                renderResources('');
                liveSearchFilterInput.focus();
            });

            // Category Filter Tab Controller
            document.querySelectorAll('.type-filter-btn').forEach(button => {
                button.addEventListener('click', () => {
                    document.querySelectorAll('.type-filter-btn').forEach(btn => {
                        btn.className = 'type-filter-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 transition active:scale-95 flex items-center gap-1.5';
                    });
                    
                    button.className = 'type-filter-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-indigo-600 text-white shadow-xs transition active:scale-95 flex items-center gap-1.5';
                    activeCategoryFilter = button.getAttribute('data-type');
                    renderResources(liveSearchFilterInput.value);
                });
            });

            // Keyboard Shortcuts Handler
            window.addEventListener('keydown', (e) => {
                if ((e.key === '/' || (e.key === 'k' && (e.metaKey || e.ctrlKey))) && document.activeElement !== liveSearchFilterInput) {
                    e.preventDefault();
                    liveSearchFilterInput.focus();
                } else if (e.key === 'Escape' && document.activeElement === liveSearchFilterInput) {
                    liveSearchFilterInput.value = '';
                    clearSearchBtn.classList.add('hidden');
                    renderResources('');
                    liveSearchFilterInput.blur();
                }
            });
        }, { once: true });
    </script>
</body>
</html>
